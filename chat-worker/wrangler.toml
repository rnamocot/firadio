name = "filradio-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false     # only reachable at chat.filradio.xyz
preview_urls = false

# Served at wss://chat.filradio.xyz/ws (filradio.xyz is already on Cloudflare).
routes = [{ pattern = "chat.filradio.xyz", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "ChatRoom"

# Visitor counter + traffic report (src/stats.js). Separate object, so counting never wakes the chat.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

# SQLite-backed Durable Objects work on the free Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

# Edge rate limits (free): checked before anything reaches the chat room.
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMIT"
namespace_id = "7102"
simple = { limit = 5, period = 60 }

# Visitor counter: counting (normally once per device per day) and reads (edge-cached for 60 s).
[[ratelimits]]
name = "HIT_LIMIT"
namespace_id = "7103"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "7104"
simple = { limit = 30, period = 60 }

# Live-listener pings (one per playing tab every 2 minutes; carriers put many phones on one IP).
[[ratelimits]]
name = "LIVE_LIMIT"
namespace_id = "7105"
simple = { limit = 40, period = 60 }

[observability]
enabled = false
